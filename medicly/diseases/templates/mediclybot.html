{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Медичний чат-бот</h1>
    <div class="card p-3">
        <div id="chat-box" class="border p-3 mb-3" style="height: 300px; overflow-y: auto; background: #f8f9fa;">
            <p><strong>Бот:</strong> Вітаю! Я можу допомогти вам з попереднім аналізом симптомів.</p>
        </div>
        <form id="chat-form">
            <div class="input-group">
                <input type="text" id="user-input" class="form-control" placeholder="Введіть ваші симптоми...">
                <button type="submit" class="btn btn-primary">Надіслати</button>
            </div>
        </form>
    </div>
</div>


{% endblock %}

{% block script_block %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
document.getElementById("chat-form").addEventListener("submit", function(event) {
    event.preventDefault();
    let userInput = document.getElementById("user-input").value;
    if (userInput.trim() === "") return;

    let chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<p><strong>Ви:</strong> ${userInput}</p>`;

    POST_URL = "{% url 'mediclybot_api' %}";
    var inputData = {
          csrfmiddlewaretoken: "{{ csrf_token }}",
          data: JSON.stringify({ message: userInput }),
        };
    $.ajax({
        url: POST_URL,
        type: "POST",
        data: inputData,
        success: function (data) {
          console.log(data);
          chatBox.innerHTML += `<p><strong>Бот:</strong> ${data.response}</p>`;
          chatBox.scrollTop = chatBox.scrollHeight;
        },
        error: function(err) {
            console.log(err);
        },
    }); // end ajax

    document.getElementById("user-input").value = "";
});
</script>
{% endblock %}
